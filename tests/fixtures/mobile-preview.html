<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Campus mobile layout check</title><style>body{margin:20px;background:#e5ece4;color:#244337;font:15px system-ui}button{padding:12px;margin:0 6px 12px 0}iframe{border:1px solid #869e89;border-radius:16px;background:#526d47;display:block}output{display:block;margin:12px 0;max-width:900px}h1{font-size:22px}</style></head><body><h1>Campus mobile layout check</h1><p>Local rendering only. Google sign-in and live rooms remain protected.</p><button data-size="320,568">Small phone · 320 × 568</button><button data-size="390,844">Phone · 390 × 844</button><button data-size="844,390">Landscape · 844 × 390</button><output id="report">Preparing campus…</output><iframe title="Phone campus preview" width="320" height="568" src="./campus-ui-preview.html?view=walk"></iframe><script type="module">const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const[w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h});window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='mobile-preview')return;const d=event.data;document.querySelector('output').textContent=`${d.viewport} · Page overflow: ${d.overflow?'YES':'none'} · Header: ${d.header} · Movement: ${d.movement} · View dock: ${d.view}`})</script></body></html>
